name: Package

on:
  push:
    tags:
    - 'v*'

jobs:
  ubuntu:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
        extension_support: [0, 1]
        include:
          - runner: ubuntu-22.04
            label: ubuntu-jammy
            asset_label: ubuntu_jammy
          - runner: ubuntu-24.04
            label: ubuntu-noble
            asset_label: ubuntu_noble
          - extension_support: 0
            variant_tag: "-noext"
          - extension_support: 1
            variant_tag: ""
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Ubuntu dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config \
                                libssl-dev libdbus-1-dev libdbus-glib-1-dev libffi-dev libkrb5-dev
    - name: Build the executable
      run: |
        pip install ./sign_client
        pip install external/okta-0.0.3.1-py2.py3-none-any.whl
        pip install -e .
        pip install -e .[test]
        pip install -e .[setup]
        make
      env:
        UST_EXTENSION: ${{matrix.extension_support}}
    - name: Get build
      run: |
        cd dist
        tar czf "user-sync-${UST_VERSION}${UST_VARIANT_TAG}-${ASSET_LABEL}.tar.gz" user-sync
      env:
        UST_VARIANT_TAG: ${{matrix.variant_tag}}
        UST_VERSION: ${{ github.ref_name }}
        ASSET_LABEL: ${{ matrix.asset_label }}
    - name: Make artifacts
      uses: actions/upload-artifact@v7
      with:
        name: "${{matrix.label}}${{matrix.variant_tag}}"
        path: dist/*.tar.gz
        retention-days: 30

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - extension_support: 0
            variant_tag: "-noext"
          - extension_support: 1
            variant_tag: ""
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: |
        pip install ./sign_client
        pip install external/okta-0.0.3.1-py2.py3-none-any.whl
        pip install -e .
        pip install -e .[test]
        pip install -e .[setup]
    - run: make standalone
      env:
        UST_EXTENSION: ${{matrix.extension_support}}
    - name: Get build
      run: |
         cd dist
         7z a user-sync-${{ github.ref_name }}${{matrix.variant_tag}}-win64.zip user-sync.exe
    - name: Make artifact
      uses: actions/upload-artifact@v7
      with:
        name: "windows${{matrix.variant_tag}}"
        path: dist/*.zip
        retention-days: 30

  rocky:
    runs-on: ubuntu-latest
    env:
      LC_ALL: en_US.utf8
      LANG: en_US.utf8
    container:
      image: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          - container: "rockylinux:8"
            label: rocky8
            extension_support: 0
            variant_tag: "-noext"
          - container: "rockylinux:8"
            label: rocky8
            extension_support: 1
            variant_tag: ""
          - container: "rockylinux:9"
            label: rocky9
            extension_support: 0
            variant_tag: "-noext"
          - container: "rockylinux:9"
            label: rocky9
            extension_support: 1
            variant_tag: ""
    steps:
      - uses: actions/checkout@v7
      - name: Update yum dependencies
        run: yum update -y
      - name: Rocky 8 dependencies
        if: ${{ matrix.container == 'rockylinux:8' }}
        run: yum install -y pkgconfig gcc openssl-devel dbus-glib-devel python3-dbus sqlite-devel libffi-devel wget make findutils glibc-langpack-en
      - name: Rocky 9 dependencies
        if: ${{ matrix.container == 'rockylinux:9' }}
        run: yum install -y pkgconfig gcc openssl-devel dbus-glib-devel python3-dbus sqlite-devel libffi-devel krb5-devel dbus-daemon wget make findutils glibc-langpack-en
      - name: Build Python 3.12
        run: |
          mkdir tmp && cd tmp
          wget https://www.python.org/ftp/python/3.12.4/Python-3.12.4.tgz
          tar xzf Python-3.12.4.tgz
          cd Python-3.12.4
          ./configure --enable-optimizations --enable-shared --enable-loadable-sqlite-extensions
          make altinstall
          cd ../..
      - name: Build executable
        run: |
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib/
          /usr/local/bin/python3.12 -m venv venv
          source venv/bin/activate
          # for some reason, pycryptodome won't install when
          # setuptools is installed/upgraded, so install it before
          # install/upgrade setuptools
          pip install pycryptodome==3.9.7
          python -m pip install --upgrade pip pyinstaller setuptools
          pip install ./sign_client
          pip install external/okta-0.0.3.1-py2.py3-none-any.whl
          pip install -e .
          pip install -e .[test]
          pip install -e .[setup]
          make
          deactivate
        env:
          UST_EXTENSION: ${{matrix.extension_support}}
      - name: Get build
        run: |
          cd dist
          LABEL=$(echo $CONTAINER | sed "s/linux://g")
          tar czf "user-sync-${UST_VERSION}${UST_VARIANT_TAG}-${LABEL}.tar.gz" user-sync
        env:
          UST_VARIANT_TAG: ${{matrix.variant_tag}}
          UST_VERSION: ${{ github.ref_name }}
          CONTAINER: ${{ matrix.container }}
      - name: Make artifact
        uses: actions/upload-artifact@v7
        with:
          name: "${{matrix.label}}${{matrix.variant_tag}}"
          path: dist/*.tar.gz
          retention-days: 30

  examples:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: user-sync-examples-zip
      run: |
         cd examples
         zip -r user-sync-examples.zip .
    - uses: actions/upload-artifact@v7
      with:
        name: examples
        path: examples/*.zip
        retention-days: 30
    - name: user-sync.tar.gz
      run: |
         tar -czvf "user-sync-examples.tar.gz" examples
    - uses: actions/upload-artifact@v7
      with:
        name: examples-tar
        path: user-sync-examples.tar.gz
        retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: [rocky, ubuntu, examples, windows]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        path: artifacts
    - name: Create release and upload assets
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: User Sync Tool ${{ github.ref_name }}
        body_path: .changelog/latest.md
        draft: false
        prerelease: false
        # Windows builds are intentionally excluded; they're signed and uploaded by an internal build server
        files: |
          artifacts/examples/*
          artifacts/examples-tar/*
          artifacts/ubuntu-jammy/*
          artifacts/ubuntu-jammy-noext/*
          artifacts/ubuntu-noble/*
          artifacts/ubuntu-noble-noext/*
          artifacts/rocky8/*
          artifacts/rocky8-noext/*
          artifacts/rocky9/*
          artifacts/rocky9-noext/*
